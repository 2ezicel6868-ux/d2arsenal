name: build-forge-1.20.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project from uploaded zip
        run: |
          set -e
          echo "=== 仓库根目录 ==="
          ls -A
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "=== 使用压缩包: $ZIP ==="
          unzip -o -q "$ZIP" -d .
          if [ ! -f build.gradle ] && [ -f destiny2-arsenal/build.gradle ]; then
            shopt -s dotglob
            mv destiny2-arsenal/* .
            rmdir destiny2-arsenal || true
          fi
          test -f settings.gradle || { echo "::error::解压后没有 settings.gradle"; exit 1; }
          test -f build.gradle || { echo "::error::解压后没有 build.gradle"; exit 1; }
          echo "=== 解压后根目录 ==="
          ls -A

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Raise Gradle heap
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G\n' >> gradle.properties
          tail -n 3 gradle.properties

      - name: Inspect project
        run: |
          set +e
          grep -nE "selfTest|net\.minecraftforge\.gradle|languageVersion|mainClass" build.gradle
          gradle --version 2>&1 | grep -E "Gradle|JVM"

      - name: Core self test
        continue-on-error: true
        run: |
          set +e
          gradle selfTest --no-daemon --stacktrace 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(sed -n '/What went wrong/,/^\* Try/p' selftest.log | head -25 | tr '\n' ' ' | cut -c1-1400)
            if [ -z "$msg" ]; then msg=$(head -40 selftest.log | tr '\n' ' ' | cut -c1-1400); fi
            echo "::error title=selfTest 失败::${msg}"
          fi
          exit 0

      - name: Build with Gradle
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(sed -n '/What went wrong/,/^\* Try/p' build.log | head -25 | tr '\n' ' ' | cut -c1-1400)
            if [ -z "$msg" ]; then msg=$(head -40 build.log | tr '\n' ' ' | cut -c1-1400); fi
            echo "::error title=编译失败::${msg}"
            exit $code
          fi

      - name: Validate project and bundled pack
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_tacz_pack.py
          python3 tools/validate.py

      - name: List jars
        run: ls -lh build/libs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destiny2-arsenal-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: ignore
