name: build-forge-1.20.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Raise Gradle heap
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G\n' >> gradle.properties
          tail -n 3 gradle.properties

      - name: Diagnose build script
        run: |
          set +e
          gradle help --no-daemon --stacktrace 2>&1 | tee help.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "was not found|Could not|FAILURE|What went wrong|error:|Caused by" -m 8 help.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=build.gradle 解析失败::${msg}"
            exit $code
          fi

      - name: Core self test
        run: |
          set +e
          gradle selfTest --no-daemon --stacktrace 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|FAILURE|What went wrong|Caused by|Could not" -m 8 selftest.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=selfTest 失败::${msg}"
            exit $code
          fi

      - name: Build with Gradle
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Execution failed" -m 8 build.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=编译失败::${msg}"
            exit $code
          fi

      - name: Validate project and bundled pack
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_tacz_pack.py
          python3 tools/validate.py

      - name: List jars
        run: ls -lh build/libs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destiny2-arsenal-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
