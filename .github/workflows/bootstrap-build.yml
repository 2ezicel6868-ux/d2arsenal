name: bootstrap-and-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate uploaded archive
        id: find
        run: |
          set -euo pipefail
          ZIP=""
          for candidate in upload-to-github.zip destiny2-arsenal-1.2.0-forge-src.zip; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::仓库根目录没有找到 zip。"
            exit 1
          fi
          echo "找到压缩包: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -euo pipefail
          ZIP="${{ steps.find.outputs.zip }}"
          unzip -o -q "$ZIP" -d .
          if [ ! -f build.gradle ] && [ -f destiny2-arsenal/build.gradle ]; then
            shopt -s dotglob
            mv destiny2-arsenal/* .
            rmdir destiny2-arsenal || true
          fi
          rm -f "$ZIP"
          echo "--- 解压后根目录 ---"
          ls -A
          test -f build.gradle || { echo "::error::解压后仍找不到 build.gradle"; exit 1; }

      - name: Commit extracted project
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore: 展开工程源码（由 bootstrap 工作流完成）"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Core self test
        run: gradle selfTest --no-daemon --stacktrace

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Validate project and bundled pack
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_tacz_pack.py
          python3 tools/validate.py
          python3 tools/package_pack.py

      - name: List built jars
        run: ls -lh build/libs dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destiny2-arsenal-forge-1.20.1
          path: |
            build/libs/*.jar
            dist/*.zip
          if-no-files-found: error
